spring:
  application:
    name: credit-card-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cardengine}
    username: ${DB_USERNAME:cardengine}
    # No default on purpose: set DB_PASSWORD in the environment (docker-compose.yml does it for local runs).
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: credit-card-engine

app:
  outbox:
    scheduling-enabled: true
    publish-interval: PT2S
    batch-size: 50

springdoc:
  swagger-ui:
    path: /swagger-ui.html
